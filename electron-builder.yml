appId: com.vesti.desktop
productName: Vesti
copyright: Copyright © 2026 VESTI Team

directories:
  output: out/installer
  buildResources: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  executableName: vesti

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Office
  executableName: vesti
  synopsis: AI conversation capture and reflection hub
  maintainer: Vesti Team <firefly.hefeng@gmail.com>

nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Vesti
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  multiLanguageInstaller: true
  installerLanguages:
    - zh_CN
    - en_US
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  include: build/installer.nsh
  artifactName: Vesti-${version}-Setup.${ext}

dmg:
  artifactName: Vesti-${version}-${arch}.${ext}
  title: Vesti

publish: null
